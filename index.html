var Q=[
{t:"Concordância",q:"Assinale a alternativa correta quanto à concordância verbal.",o:["Fazem dois anos que ele foi nomeado.","Houveram muitos candidatos na prova.","Existem dúvidas sobre o edital.","Devem haver soluções para o problema.","Haviam muitos processos pendentes."],c:2,e:"FAZER (tempo) e HAVER (existir) são impessoais: ficam no singular. 'Existir' é pessoal e concorda com o sujeito: 'Existem dúvidas'."},
{t:"Concordância",q:"Assinale a alternativa correta.",o:["Vendem-se imóveis financiados.","Aluga-se casas no centro.","Existe vários motivos para o recurso.","Precisam-se de escreventes.","Fazem dois meses que ele saiu."],c:0,e:"Na voz passiva sintética o verbo concorda com o sujeito: 'Vendem-se imóveis'. Corretos seriam: 'Alugam-se casas', 'Existem vários motivos', 'Precisa-se de escreventes'."},
{t:"Concordância",q:"Assinale a alternativa em que a concordância nominal está correta.",o:["Seguem anexo as certidões.","É necessário a presença das partes.","Ela mesma assinou o documento.","Os autos estavam meia confusos.","Seguem inclusos o ofício e a certidão."],c:2,e:"'Mesmo' concorda com o termo a que se refere: 'Ela mesma'. 'Anexo' concorda: 'anexas as certidões'. 'Meio' (advérbio) é invariável."},
{t:"Concordância",q:"Assinale a alternativa correta.",o:["Fui eu que pagou a conta.","Fui eu que paguei a conta.","Fomos nós que paguei a conta.","Foram eles que pagou a conta.","Sou eu quem pagam a conta."],c:1,e:"Com o pronome relativo 'que', o verbo concorda com o antecedente: 'Fui eu que paguei'."},
{t:"Concordância",q:"Assinale a alternativa correta.",o:["Mais de um candidato foram aprovados.","Cerca de cem pessoas compareceu.","Os Estados Unidos é uma potência.","Não se aplica aos casos omissos as regras antigas.","Um dos servidores que trabalham no fórum foi promovido."],c:4,e:"'Um dos servidores que trabalham': o 'que' retoma 'servidores', então o plural é adequado. As demais: 'foi aprovado', 'compareceram', 'são', 'aplicam-se'."},
{t:"Regência",q:"Assinale a alternativa com regência correta.",o:["O juiz assistiu o julgamento.","O candidato aspira o cargo.","Os servidores obedecem às normas.","Preferiu mais o descanso do que o trabalho.","Visava o cargo de chefia."],c:2,e:"OBEDECER é transitivo indireto (obedecer A). Corretos seriam: 'assistiu ao julgamento', 'aspira ao cargo', 'preferiu o descanso ao trabalho', 'visava ao cargo'."},
{t:"Regência",q:"Assinale a alternativa em que 'implicar' está empregado conforme a norma-padrão.",o:["A decisão implicou em prejuízo.","A decisão implicou prejuízo.","A decisão implicou de prejuízo.","A decisão implicou a prejuízo.","A decisão implicou por prejuízo."],c:1,e:"IMPLICAR, no sentido de 'acarretar', é transitivo direto: 'implicou prejuízo'. 'Implicar em' é condenado pela norma-padrão."},
{t:"Regência",q:"Assinale a alternativa correta quanto à regência.",o:["Prefiro cinema do que teatro.","Prefiro cinema a teatro.","Prefiro mais cinema que teatro.","Prefiro cinema em vez de a teatro.","Prefiro cinema ao invés de teatro."],c:1,e:"PREFERIR pede 'a': 'prefiro X a Y', sem 'mais' nem 'do que'."},
{t:"Regência",q:"Assinale a alternativa correta.",o:["O réu foi informado da sentença.","O réu foi informado sobre de a sentença.","O réu informou da sentença.","Informei a sentença do réu.","O réu foi informado a sentença."],c:0,e:"INFORMAR admite 'informar alguém DE algo' ou 'informar algo A alguém'. 'O réu foi informado da sentença' é a forma correta."},
{t:"Regência",q:"Assinale a alternativa em que o verbo 'chegar' está corretamente regido.",o:["Cheguei no fórum cedo.","Cheguei ao fórum cedo.","Cheguei do fórum cedo.","Cheguei de fórum cedo.","Cheguei em fórum cedo."],c:1,e:"CHEGAR pede a preposição 'a' (movimento, destino): 'Cheguei ao fórum'. O uso com 'em' é coloquial."},
{t:"Crase",q:"Assinale a alternativa em que o emprego do acento grave está correto.",o:["Fomos à pé até o fórum.","Entreguei o documento à Vossa Senhoria.","Refiro-me à decisão proferida ontem.","Ele começou à trabalhar cedo.","Estou disposto à colaborar."],c:2,e:"'Referir-se' pede 'a' e 'decisão' aceita artigo 'a': a + a = à. Não há crase antes de verbo, de pronome de tratamento ou de palavra masculina."},
{t:"Crase",q:"Assinale a alternativa correta quanto ao uso da crase.",o:["Ele foi à Brasília.","Ele voltou da Bahia e foi à Roma.","Ele foi à Bahia.","Ele chegou à casa do juiz.","Ele chegou à pé."],c:2,e:"Antes de 'Bahia' há artigo ('a Bahia'): 'foi à Bahia'. 'Brasília' e 'Roma' não admitem artigo, então 'foi a Brasília', 'foi a Roma'. 'Chegou a casa' (casa sem adjunto, sem crase)."},
{t:"Crase",q:"Assinale a alternativa em que a crase é facultativa.",o:["Fui à escola.","Dirigi-me à minha colega.","Vou a Roma.","Estou diante da ré.","Chegou às duas horas."],c:1,e:"Antes de pronome possessivo feminino no singular, a crase é facultativa: 'Dirigi-me à minha colega' ou 'a minha colega'."},
{t:"Pontuação",q:"Assinale a alternativa em que a vírgula está empregada corretamente.",o:["O juiz, decidiu o caso.","O juiz decidiu, o caso.","O réu, que estava ausente, foi intimado.","O réu que estava ausente, foi intimado.","O réu, foi intimado."],c:2,e:"A oração subordinada adjetiva explicativa ('que estava ausente') vem entre vírgulas. Não se separa sujeito do verbo por vírgula isolada."},
{t:"Pontuação",q:"Em qual alternativa a vírgula foi empregada de acordo com a norma-padrão?",o:["Os candidatos aprovados, receberão a convocação.","Os candidatos, aprovados receberão a convocação.","Os candidatos aprovados receberão a convocação.","Os candidatos aprovados receberão, a convocação.","Os candidatos, receberão a convocação aprovados."],c:2,e:"Não se separa sujeito de predicado nem verbo de complemento com vírgula. A frase correta não tem vírgulas."},
{t:"Pontuação",q:"Assinale a alternativa em que a vírgula isola corretamente um aposto.",o:["Machado de Assis, escritor brasileiro, nasceu no Rio.","Machado de Assis escritor brasileiro, nasceu
